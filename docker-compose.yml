# Infisical for Hisho. Images are pinned; the backend listens on 127.0.0.1 only.
# Secrets for the server itself (ENCRYPTION_KEY, AUTH_SECRET, POSTGRES_PASSWORD) are in .env,
# written once by bin/install.sh (0600). Losing ENCRYPTION_KEY loses every secret stored here.
services:
  backend:
    container_name: infisical-backend
    image: ${INFISICAL_IMAGE}
    restart: unless-stopped
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_started}
    env_file: .env
    environment:
      - NODE_ENV=production
    mem_limit: 1536m          # a desk PC: Infisical suggests ~2 GB for the whole stack
    ports:
      - "127.0.0.1:${INFISICAL_PORT}:8080"
    networks: [infisical]
  redis:
    container_name: infisical-redis
    image: redis:7.4-alpine
    restart: unless-stopped
    mem_limit: 256m          # Infisical queues jobs in Redis: no eviction, just a ceiling
    volumes: [redis_data:/data]
    networks: [infisical]
  db:
    container_name: infisical-db
    image: postgres:16-alpine
    restart: unless-stopped
    mem_limit: 512m
    env_file: .env
    volumes: [pg_data:/var/lib/postgresql/data]
    networks: [infisical]
    healthcheck:
      test: "pg_isready --username=$${POSTGRES_USER}"
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  pg_data: {}
  redis_data: {}
networks:
  infisical: {}
